boost:
  name: Boost a load
  description: >-
    Runs a scheduled load now for a given duration, overriding both the price
    plan and the load's enable switch — the same override the load's Boost
    button applies, but with an explicit duration so automations can ask for
    exactly as much heat as they need.
  target:
    entity:
      integration: load_scheduler
  fields:
    minutes:
      name: Duration
      description: >-
        How long to run, in minutes. Defaults to the load's current target
        runtime, or 60 minutes when its target is zero.
      required: false
      example: 90
      selector:
        number:
          min: 5
          max: 1440
          step: 5
          unit_of_measurement: min
          mode: box

adjust_boost:
  name: Adjust boost
  description: >-
    Add or subtract minutes from each targeted load's active boost end time.
    Negative adjustments can shorten a boost below five minutes; positive
    adjustments cannot extend the end beyond 24 hours from now.
  target:
    entity:
      integration: load_scheduler
  fields:
    minutes:
      name: Minutes to add
      description: Positive values extend the active boost; negative values shorten it.
      required: true
      example: -15
      selector:
        number:
          min: -1440
          max: 1440
          step: 1
          unit_of_measurement: min
          mode: box

cancel_boost:
  name: Cancel boost
  description: >-
    Stop each targeted load's active boost now. Inactive or expired boosts are
    left alone.
  target:
    entity:
      integration: load_scheduler
